<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Controle de TI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body { background: #07142d; display: flex; justify-content: center; align-items: center; height: 100vh; }
.login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
.login-box h2 { text-align: center; margin-bottom: 20px; color: #172554; }
.campo { display: flex; flex-direction: column; margin-bottom: 15px; }
.campo label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #34415d; }
.campo input { padding: 11px; border: 1px solid #ccd6e5; border-radius: 7px; font-size: 14px; outline: none; }
.campo input:focus { border-color: #126be9; }
.btn-login { width: 100%; padding: 12px; background: #126be9; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
.btn-login:hover { background: #0b5dcc; }
</style>
</head>
<body>

<div class="login-box">
    <h2>🔑 Acesso ao Sistema</h2>
    <div class="campo">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seuemail@empresa.com">
    </div>
    <div class="campo">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ijzjrpdwbqarurnfdmpf.supabase.co";
const SUPABASE_KEY = "sb_publishable_1Jq9M9jRiR_2I2ndxq5stg_R3gT4DBb";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function fazerLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("senha").value;

    if (!email || !password) return alert("Preencha todos os campos.");

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
        alert("Erro no login: " + error.message);
    } else {
        window.location.href = "index.html";
    }
}
</script>
</body>
</html>
